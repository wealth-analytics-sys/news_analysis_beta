# Metrics dictionary seed — canonical names, aliases, category, default persistence tier.
#
# AWAITING RUSHABH'S REVIEW (CLAUDE.md §9 open question 4). Load with:
#   python -m src.load_dictionaries
#
# default_persistence_tier follows the §5.1 rule 4 test:
#   "will this differ next week AND does an authoritative feed exist?" -> event_context
# The LLM may override with a tier_override_reason.
#
# NOT PERSISTED AT ALL (decision D1): benchmark index closes, index session % moves and
# single-stock daily % moves. They are listed here with tier `transient` so S4 has an
# explicit signal, but S5 never writes them to extracted_facts.

metrics:
  # ---------------- transient: never stored (D1)
  - canonical_name: sensex_close
    aliases: [bse sensex, sensex, s&p bse sensex]
    category: equity
    default_persistence_tier: transient
  - canonical_name: sensex_change_pct
    aliases: [sensex change, sensex move]
    category: equity
    default_persistence_tier: transient
  - canonical_name: nifty50_close
    aliases: [nifty, nifty 50, nse nifty]
    category: equity
    default_persistence_tier: transient
  - canonical_name: nifty50_change_pct
    aliases: [nifty change, nifty move]
    category: equity
    default_persistence_tier: transient
  - canonical_name: bank_nifty_close
    aliases: [nifty bank, bank nifty]
    category: equity
    default_persistence_tier: transient
  - canonical_name: stock_daily_change_pct
    aliases: [share price change, stock move]
    category: equity
    default_persistence_tier: transient

